<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
		<!-- Applies a stored theme before first paint (keep in sync with src/lib/theme.ts). The
		     server allows this inline script by its SHA-256 in the CSP. -->
		<script>
			try {
				var t = localStorage.getItem('truelite-theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- No inline style: the CSP allows stylesheets from 'self' only (see tokens.css). -->
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
