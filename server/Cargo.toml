[package]
name = "truelite"
version = "0.15.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mime_guess = "2.0.5"
ring = { version = "0.17.14", default-features = false }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
# Size over speed: the server is I/O-bound (a WebSocket bridge), "s" is ~22% smaller than 3.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
# panic stays "unwind": with "abort", a panic in one browser socket or NAS session task would
# kill the whole server instead of only that task.
