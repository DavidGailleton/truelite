# Example for a TrueNAS "Custom App" (Apps > Discover > Install via YAML).
services:
  truelite:
    image: ghcr.io/davidgailleton/truelite:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      TRUELITE_LISTEN: "0.0.0.0:8080"
      # See .env.example for how to get the fingerprint.
      # TRUELITE_NAS_URL: "wss://truenas.local"
      # TRUELITE_NAS_FINGERPRINT: "AB:CD:..."
      RUST_LOG: "info"
