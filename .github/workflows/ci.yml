name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Force this version (e.g. 1.0.0). Empty = computed from commits."
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web — install, check, build
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Server — fmt, clippy, test
        working-directory: server
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Every push to main becomes a version: bump from conventional commits (see cliff.toml),
  # commit the bump + CHANGELOG.md, tag vX.Y.Z and publish a GitHub Release.
  # Pushes made with GITHUB_TOKEN do not trigger workflows, so this never loops.
  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Next version
        id: next
        env:
          FORCED: ${{ inputs.version }}
        run: |
          current=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          if [ -n "$FORCED" ]; then
            next="v${FORCED#v}"
          else
            next=$(git-cliff --bumped-version)
          fi
          if [ "$next" = "$current" ]; then
            echo "No new commits since $current (already released by an earlier run)."
            exit 0
          fi
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $next"
      - name: Bump, changelog, tag, push
        if: steps.next.outputs.version != ''
        env:
          V: ${{ steps.next.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" server/Cargo.toml
          awk -v v="$V" 'p && /^version = / {$0="version = \"" v "\""; p=0} /^name = "truelite"$/ {p=1} 1' \
            server/Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp server/Cargo.lock
          (cd web && npm version "$V" --no-git-tag-version --allow-same-version)
          git-cliff --tag "v$V" -o CHANGELOG.md
          git-cliff --tag "v$V" --unreleased --strip all > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/Cargo.toml server/Cargo.lock web/package.json web/package-lock.json CHANGELOG.md
          git commit -m "chore(release): v$V"
          git tag -a "v$V" -m "v$V"
          git push origin HEAD:main "v$V"
      - name: GitHub Release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.next.outputs.version }}
        run: gh release create "v$V" --title "v$V" --notes-file "$RUNNER_TEMP/notes.md"

  image:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
